<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>希音店铺导航</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10b981">
<style>
  :root{
    --bg:#eafaf0;
    --bg2:#f3fcf6;
    --bg3:#e6f8ee;
    --card:rgba(226,244,251,.74);
    --ink:#0f2f42;
    --sub:#5b7d8c;
    --line:rgba(20,70,95,.10);
    --acR:34;--acG:211;--acB:238;
    --accent:#22d3ee;
    --accent2:#3b82f6;
    --aurora3:#818cf8;
    --c1:34,211,238;--c2:59,130,246;--c3:129,140,248;
    --grp:rgba(var(--acR),var(--acG),var(--acB),.10);
    --grpink:#22d3ee;
    --ac-d:#0e9fbf;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;
       background:
         radial-gradient(1100px 620px at 6% -10%, rgba(var(--acR),var(--acG),var(--acB),.22), transparent 60%),
         radial-gradient(1000px 600px at 94% 2%, rgba(var(--acR),var(--acG),var(--acB),.18), transparent 62%),
         radial-gradient(900px 720px at 50% 118%, rgba(var(--acR),var(--acG),var(--acB),.22), transparent 60%),
         linear-gradient(180deg,#eaf6fb 0%,#f3fafe 55%,#e8f5fb 100%);
       background-attachment:fixed}
  .top{position:sticky;top:0;z-index:20;color:var(--ink);
       background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       border-bottom:1px solid rgba(45,43,85,.08);
       padding:14px 16px 12px;box-shadow:0 4px 24px rgba(var(--acR),var(--acG),var(--acB),.10)}
  .top h1{margin:0;font-size:19px;display:flex;align-items:center;gap:8px;
         background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));
         -webkit-background-clip:text;background-clip:text;color:transparent}
  .top .sub{font-size:12px;color:var(--sub);margin-top:2px}
  .bar{display:flex;gap:8px;margin-top:10px;align-items:center}
  .search{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.65);border:1px solid rgba(45,43,85,.10);
         border-radius:20px;padding:7px 12px;color:var(--ink)}
  .search input{border:0;outline:0;background:transparent;flex:1;font-size:14px;color:var(--ink)}
  .search input::placeholder{color:#9ca3af}
  .btn{border:0;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-ghost{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid rgba(45,43,85,.08)}
  .btn-ghost.on{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff;border-color:transparent}
  .btn.dirty{background:linear-gradient(135deg,var(--ac-d),var(--accent));color:#fff;border-color:transparent;animation:savePulse 1.5s ease-in-out infinite}
  @keyframes savePulse{0%,100%{box-shadow:0 2px 8px rgba(var(--acR),var(--acG),var(--acB),.25)}50%{box-shadow:0 2px 16px rgba(var(--acR),var(--acG),var(--acB),.55)}}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 60px;position:relative;z-index:1}
  .grp{background:var(--card);border:1px solid rgba(255,255,255,.7);border-radius:16px;margin-bottom:16px;
       overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
       box-shadow:0 8px 28px rgba(var(--acR),var(--acG),var(--acB),.12)}
  .grp-head{background:var(--grp);display:flex;align-items:center;gap:8px;padding:12px 16px;
           border-left:4px solid var(--grpink)}
  .grp-head .gname{font-weight:700;font-size:16px;flex:1;color:var(--ink)}
  .grp-head .cnt{font-size:12px;color:var(--ink);background:rgba(255,255,255,.55);padding:2px 10px;border-radius:10px}
  .grp-head .mini{border:0;background:rgba(var(--acR),var(--acG),var(--acB),.12);color:var(--accent);border-radius:12px;
                 padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
  .grp-head .openall{margin-left:auto}
  .grp-head .del{border:0;background:rgba(239,68,68,.10);color:#ef4444;border-radius:12px;padding:4px 9px;font-size:12px;cursor:pointer}
  .g-handle{display:none;align-items:center;color:var(--accent);font-size:18px;padding-right:4px;cursor:grab;touch-action:none}
  .s-handle{display:none;align-items:center;justify-content:center;color:rgba(45,43,85,.35);font-size:16px;width:22px;flex-shrink:0;cursor:grab;touch-action:none}
  .manage .g-handle{display:flex}
  .grp.sorting .s-handle{display:flex}
  .sortable-ghost{opacity:.35;background:rgba(var(--acR),var(--acG),var(--acB),.08)}
  .sortable-chosen{box-shadow:0 2px 16px rgba(var(--acR),var(--acG),var(--acB),.25);border-radius:12px}
  .list{padding:10px 12px 14px;min-height:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .item{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid transparent;border-radius:12px;text-decoration:none;color:var(--ink);
       background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(var(--line),var(--line)) border-box;transition:transform .1s,box-shadow .1s,background .2s;position:relative;overflow:hidden}
  .item::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;mix-blend-mode:screen;
       background:linear-gradient(115deg,transparent 42%,rgba(var(--acR),var(--acG),var(--acB),.22) 50%,transparent 58%);
       transform:translateX(-130%);animation:cardSheen 7.5s ease-in-out infinite}
  .item:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(var(--acR),var(--acG),var(--acB),.30);
       background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3)) border-box}
  .item:active{transform:translateY(0) scale(.985);box-shadow:0 3px 10px rgba(var(--acR),var(--acG),var(--acB),.18);transition:transform .06s}
  .item .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));
            color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;box-shadow:0 3px 8px rgba(var(--acR),var(--acG),var(--acB),.25);
            animation:icGlow 4s ease-in-out infinite}
  @keyframes cardSheen{0%,72%{transform:translateX(-130%)}86%,100%{transform:translateX(130%)}}
  @keyframes icGlow{0%,100%{filter:brightness(1);box-shadow:0 3px 8px rgba(var(--acR),var(--acG),var(--acB),.25)}50%{filter:brightness(1.08);box-shadow:0 4px 12px rgba(var(--acR),var(--acG),var(--acB),.38)}}
  /* ===== 背景氛围动效：极光光团漂浮 + 整片呼吸 + 极光光点上浮（体积更小、数量更多、上 GPU 合成层）===== */
  @keyframes auroraDriftA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3vmax,2vmax) scale(1.08)}}
  @keyframes auroraDriftB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3.5vmax,-2.5vmax) scale(1.10)}}
  @keyframes auroraBreathe{0%{opacity:.5;transform:scale(1)}40%{opacity:1;transform:scale(1.05)}70%{opacity:.74;transform:scale(1.02)}100%{opacity:.5;transform:scale(1)}}
  @keyframes sparkRise{0%{transform:translate(0,0) scale(.55);opacity:0}8%{opacity:.9}50%{transform:translate(calc(var(--sx,0px)),-59vh) scale(1)}88%{opacity:.5}100%{transform:translate(calc(var(--sx,0px) * .35),-118vh) scale(1);opacity:0}}
  .aurora{animation:auroraBreathe 15s ease-in-out infinite;will-change:opacity,transform}
  .aurora .blob{position:absolute;border-radius:50%;filter:blur(50px);will-change:transform;
       background:radial-gradient(circle at 50% 50%, rgba(var(--bc),.40), transparent 66%)}
  .aurora .b1{--bc:var(--c1);width:38vmax;height:38vmax;left:-12vmax;top:-14vmax;animation:auroraDriftA 29s ease-in-out infinite}
  .aurora .b2{--bc:var(--c2);width:34vmax;height:34vmax;right:-10vmax;top:-6vmax;animation:auroraDriftB 25s ease-in-out infinite}
  .aurora .b3{--bc:var(--c3);width:42vmax;height:42vmax;left:4vmax;bottom:-18vmax;animation:auroraDriftA 31s ease-in-out infinite}
  .aurora .b4{--bc:var(--c1);width:30vmax;height:30vmax;right:-4vmax;bottom:-4vmax;animation:auroraDriftB 23s ease-in-out infinite}
  .aurora .b5{--bc:var(--c2);width:40vmax;height:40vmax;left:30vmax;top:-10vmax;animation:auroraDriftA 27s ease-in-out infinite}
  .aurora .b6{--bc:var(--c3);width:32vmax;height:32vmax;right:18vmax;bottom:-12vmax;animation:auroraDriftB 33s ease-in-out infinite}
  .aurora .b7{--bc:var(--c1);width:36vmax;height:36vmax;left:-8vmax;bottom:6vmax;animation:auroraDriftB 28s ease-in-out infinite}
  .aurora .b8{--bc:var(--c2);width:28vmax;height:28vmax;right:6vmax;top:8vmax;animation:auroraDriftA 24s ease-in-out infinite}
  .aurora .b9{--bc:var(--c3);width:44vmax;height:44vmax;left:16vmax;bottom:-22vmax;animation:auroraDriftB 35s ease-in-out infinite}
  .aurora .spark{position:absolute;bottom:-12vh;border-radius:50%;width:var(--sz,14px);height:var(--sz,14px);filter:blur(.8px);opacity:0;will-change:transform,opacity;animation:sparkRise linear infinite;
       left:var(--x,50%);
       background:radial-gradient(circle, rgba(255,255,255,.95), rgba(var(--c1),.55) 42%, transparent 72%)}
  @media (prefers-reduced-motion: reduce){.aurora,.aurora .blob,.aurora .spark{animation:none!important}}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .item .nt{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .arrow{color:rgba(45,43,85,.25);font-size:18px;flex-shrink:0}
  .item .ops{display:none;gap:6px;flex-shrink:0}
  .manage .item .ops{display:flex}
  .ops button{border:0;background:rgba(45,43,85,.06);color:var(--ink);border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}
  .ops .e{color:var(--aurora3)}.ops .d{color:#ef4444}
  .empty{color:var(--sub);text-align:center;padding:18px;font-size:13px;grid-column:1/-1}
  .mask{position:fixed;inset:0;background:rgba(45,43,85,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .mask.show{display:flex}
  .modal{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);border-radius:18px;width:100%;max-width:420px;padding:20px;color:var(--ink);box-shadow:0 20px 60px rgba(var(--acR),var(--acG),var(--acB),.2)}
  .modal h3{margin:0 0 14px;font-size:17px;color:var(--ink)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
  .field input{width:100%;border:1px solid rgba(45,43,85,.12);background:rgba(45,43,85,.03);border-radius:10px;padding:10px 12px;font-size:15px;outline:0;color:var(--ink)}
  .field input:focus{border-color:var(--accent)}
  .modal .actions{display:flex;gap:10px;margin-top:6px}
  .modal .actions .btn{flex:1;padding:11px;border-radius:10px}
  .primary{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff}
  .secondary{background:rgba(45,43,85,.06);color:var(--ink)}
  .foot{text-align:center;color:var(--sub);font-size:12px;padding:10px 0 0}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);color:var(--ink);border:1px solid rgba(var(--acR),var(--acG),var(--acB),.2);
         padding:10px 18px;border-radius:10px;font-size:14px;z-index:99;display:none;box-shadow:0 12px 40px rgba(var(--acR),var(--acG),var(--acB),.18)}
  /* ===== 自定义主题色面板 ===== */
  @media (max-width:640px){
    .list{grid-template-columns:1fr}
    .bar{flex-wrap:wrap}
    .search{width:100%;order:-1;margin-bottom:6px}
  }
/* ===== 背景底层：天气极光静态光团（动效由下方天气动效层负责）===== */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:brightness(.9);transform-origin:center}
.frost{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(238,248,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media (prefers-reduced-motion:reduce){.item,.item .ic,.item::after{animation:none}}
/* ===== 收藏 / 复制 按钮 ===== */
.item .fav,.item .copy{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:8px;
  font-size:14px;cursor:pointer;flex-shrink:0;transition:transform .1s,background .1s,box-shadow .1s}
.item .fav{background:rgba(var(--acR),var(--acG),var(--acB),.12);color:var(--accent)}
.item .fav.on{background:rgba(var(--acR),var(--acG),var(--acB),.24);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(var(--acR),var(--acG),var(--acB),.4)}
.item .copy{background:rgba(45,43,85,.07);color:var(--sub)}
.item .fav:active,.item .copy:active{transform:scale(.9)}
/* ===== 精简模式：仅紧凑卡片，不改变其它交互/动效 ===== */
body.compact .grp{margin-bottom:10px}
body.compact .grp-head{padding:8px 14px;gap:6px}
body.compact .list{padding:6px 10px 8px;gap:6px}
body.compact .item{padding:6px 10px;border-radius:10px;gap:8px}
body.compact .item .ic{width:25px;height:25px;border-radius:7px;font-size:11px}
body.compact .item .nm{font-size:13px}
body.compact .item .nt{font-size:11px}
body.compact .item .fav,body.compact .item .copy{width:22px;height:22px}
body.compact .item .fav,body.compact .item .copy,body.compact .item .arrow{display:none}
.grp.collapsed .list{display:none}
.grp .chev{font-size:13px;line-height:1;padding:4px 8px}
/* ===== 深色模式 ===== */
body.dark{--bg:#0c1b14;--card:rgba(255,255,255,.06);--ink:#e7f5ec;--sub:#9ec3b1;--line:rgba(255,255,255,.12);
  background:
    radial-gradient(1100px 620px at 6% -10%, rgba(var(--acR),var(--acG),var(--acB),.30), transparent 60%),
    radial-gradient(1000px 600px at 94% 2%, rgba(var(--acR),var(--acG),var(--acB),.26), transparent 62%),
    radial-gradient(900px 720px at 50% 118%, rgba(var(--acR),var(--acG),var(--acB),.30), transparent 60%),
    linear-gradient(180deg,#0a1611 0%,#0e1f18 55%,#0a1611 100%);
  background-attachment:fixed}
body.dark{--acR:34;--acG:199;--acB:154;--accent:#22c79a;--accent2:#38bdf8;--aurora3:#a78bfa;--grpink:#22c79a;--ac-d:#16a47a;--card:rgba(22,26,48,.70);--ink:#e8f6ff;--sub:#9fb8d0;--line:rgba(255,255,255,.10);--c1:34,199,154;--c2:56,189,248;--c3:167,139,250;
  background:radial-gradient(1100px 620px at 6% -10%, rgba(34,199,154,.24), transparent 60%),
              radial-gradient(1000px 600px at 94% 2%, rgba(56,189,248,.22), transparent 62%),
              radial-gradient(900px 720px at 50% 118%, rgba(167,139,250,.26), transparent 60%),
              linear-gradient(180deg,#0b1022 0%,#12162e 55%,#090d1e 100%);background-attachment:fixed}
body.dark .frost{background:rgba(8,12,26,.18)}
body.dark .top{background:rgba(14,18,38,.70);border-bottom-color:rgba(255,255,255,.10);box-shadow:0 4px 24px rgba(0,0,0,.35)}
body.dark .grp{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.10);box-shadow:0 8px 28px rgba(0,0,0,.40)}
body.dark .grp-head{background:rgba(var(--acR),var(--acG),var(--acB),.18)}
body.dark .item:hover{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3)) border-box}
body.dark .search{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
body.dark .search input{color:var(--ink)}
body.dark .btn-ghost{background:rgba(255,255,255,.08);color:var(--ink);border-color:rgba(255,255,255,.10)}
body.dark .ops button{background:rgba(255,255,255,.12);color:var(--ink)}
body.dark .field input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:var(--ink)}
body.dark .modal{background:rgba(16,20,40,.97);border-color:rgba(255,255,255,.12);color:var(--ink)}
body.dark .toast{background:rgba(16,20,40,.97);color:var(--ink);border-color:rgba(var(--acR),var(--acG),var(--acB),.35)}
body.dark .mask{background:rgba(0,0,0,.55)}
body.dark .noise{opacity:.05}
/* ===== 新增：高亮 / 备份 / 回收站 / 分享 / 快捷键 ===== */
mark{background:rgba(var(--acR),var(--acG),var(--acB),.28);color:inherit;border-radius:3px;padding:0 2px;font-weight:700}
.toast{align-items:center;gap:10px}
.toast-act{margin-left:4px;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
.trash-list{max-height:52vh;overflow:auto;margin:6px 0}
.trash-item{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.trash-item .tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trash-item .ttag{font-size:11px;color:var(--sub);margin-right:4px}
.trash-item button{border:0;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600}
.trash-item .restore{background:rgba(var(--acR),var(--acG),var(--acB),.14);color:var(--accent)}
.trash-item .del{background:rgba(239,68,68,.10);color:#ef4444}
.bak-row{display:flex;gap:10px;margin-top:10px}
.bak-row .btn{flex:1;text-align:center}
/* ===== 天气背景已移除：改为固定冰蓝极光背景（见 .aurora 光团与 body 基色）；天气卡片照常显示 ===== */
/* ===== 天气小卡片（顶栏下方，点击设置城市/重定位；跟随冰蓝极光主题色）===== */
.wcard{display:flex;flex-direction:column;gap:5px;margin:10px auto 0;max-width:560px;width:calc(100% - 32px);
  padding:9px 14px;border-radius:16px;background:var(--card);border:1px solid rgba(var(--acR),var(--acG),var(--acB),.28);
  color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(var(--acR),var(--acG),var(--acB),.12);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:.2s}
.wcard:hover{border-color:rgba(var(--acR),var(--acG),var(--acB),.55);transform:translateY(-1px)}
.wcard .wrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.wcard .wleft{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.wcard .wemo{font-size:16px;line-height:1}
.wcard .wcity{color:var(--accent);overflow:hidden;text-overflow:ellipsis}
.wcard .wdesc{opacity:.85;overflow:hidden;text-overflow:ellipsis}
.wcard .wtemp{font-size:20px;font-weight:800;color:var(--accent);text-align:center}
.wcard .wsub{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.82;flex-wrap:wrap}
.wcard .wsub .wa{color:var(--accent);font-weight:700}
body.compact .wcard{display:none}
.field select.wx-sel{width:100%;padding:9px 10px;border-radius:10px;border:1px solid rgba(var(--acR),var(--acG),var(--acB),.3);
  background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;cursor:pointer}
.field select.wx-sel:focus{outline:none;border-color:rgba(var(--acR),var(--acG),var(--acB),.6)}
.wx-inp{width:100%;padding:9px 10px;border-radius:10px;border:1px solid rgba(var(--acR),var(--acG),var(--acB),.3);
  background:var(--card);color:var(--ink);font-size:14px;font-family:inherit}
.wx-inp:focus{outline:none;border-color:rgba(var(--acR),var(--acG),var(--acB),.6)}
.wx-results{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:42vh;overflow:auto}
.wx-res{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border-radius:10px;
  border:1px solid rgba(var(--acR),var(--acG),var(--acB),.22);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.wx-res:hover{border-color:rgba(var(--acR),var(--acG),var(--acB),.55)}
.wx-res .wxrn{font-size:14px;font-weight:700}
.wx-res .wxra{font-size:12px;opacity:.7}
.wx-loading{font-size:12px;color:var(--sub);opacity:.8;padding:4px 2px}
.whourly{display:flex;gap:8px;margin:8px auto 0;max-width:560px;width:calc(100% - 32px);overflow-x:auto;padding:6px 4px;
  border-radius:14px;background:var(--card);border:1px solid rgba(var(--acR),var(--acG),var(--acB),.22);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.whourly .wh{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px;padding:4px 2px;
  border-radius:10px;color:var(--ink);font-size:12px;font-weight:600}
.whourly .wh .wht{opacity:.7;font-size:11px}
.whourly .wh .whe{font-size:17px;line-height:1}
.whourly .wh .whv{color:var(--accent);font-weight:800}
body.compact .whourly{display:none}
/* ===== 常用办公工具（独立工具视图）===== */
.tools-app{display:flex;gap:14px;margin-top:2px}
.tools-nav{width:170px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;max-height:60vh;overflow:auto;padding-right:4px}
.tools-nav button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center;font-family:inherit}
.tools-nav button .ti{font-size:15px;width:18px;text-align:center}
.tools-nav button:hover{background:rgba(var(--acR),var(--acG),var(--acB),.10)}
.tools-nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff}
.tools-body{flex:1;min-width:0;max-height:62vh;overflow:auto;padding-right:2px}
.tools-body .t-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.t-field{margin-bottom:10px}
.t-field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.t-field input,.t-field select,.t-field textarea{width:100%;border:1px solid rgba(45,43,85,.14);background:rgba(45,43,85,.03);border-radius:10px;padding:9px 11px;font-size:14px;outline:0;color:var(--ink);font-family:inherit}
.t-field input:focus,.t-field textarea:focus,.t-field select:focus{border-color:var(--accent)}
.t-field textarea{resize:vertical;min-height:90px;line-height:1.5}
.t-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.t-row .t-field{margin-bottom:0}
.t-res{margin-top:8px;font-size:14px;color:var(--ink);line-height:1.7}
.t-res b{color:var(--accent)}
.t-res code{background:rgba(var(--acR),var(--acG),var(--acB),.12);padding:1px 6px;border-radius:6px;font-size:13px}
.t-cal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:360px}
.t-cal button{border:0;border-radius:10px;padding:12px 0;font-size:16px;font-weight:700;cursor:pointer;background:rgba(var(--acR),var(--acG),var(--acB),.12);color:var(--ink);font-family:inherit}
.t-cal button.c-op{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff}
.t-cal button.c-eq{background:var(--ac-d);color:#fff}
.t-cal button.c-fn{background:rgba(45,43,85,.08)}
.t-cal-disp{font-size:22px;font-weight:800;text-align:right;padding:10px 12px;border-radius:10px;background:rgba(45,43,85,.05);margin-bottom:8px;min-height:30px;overflow:auto;color:var(--ink)}
.t-nav-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.t-nav-tabs button{border:0;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;background:rgba(var(--acR),var(--acG),var(--acB),.10);color:var(--ink);font-family:inherit}
.t-nav-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff}
.t-out{margin-top:10px;background:rgba(var(--acR),var(--acG),var(--acB),.07);border:1px solid rgba(var(--acR),var(--acG),var(--acB),.18);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word;min-height:20px;color:var(--ink);line-height:1.6}
body.dark .t-field input,body.dark .t-field select,body.dark .t-field textarea{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:var(--ink)}
body.dark .tools-nav button:hover{background:rgba(255,255,255,.10)}
body.dark .t-cal button{background:rgba(255,255,255,.10)}
body.dark .t-cal button.c-fn{background:rgba(255,255,255,.06)}
body.dark .t-out{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
@media (max-width:640px){ .tools-app{flex-direction:column} .tools-nav{width:100%;flex-direction:row;flex-wrap:wrap;max-height:none} .tools-nav button{flex:1 1 auto;justify-content:center} .tools-body{max-height:none} }
.t-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff;font-family:inherit;min-width:36px}
.t-btn.ghost{background:rgba(var(--acR),var(--acG),var(--acB),.12);color:var(--ink)}
.t-btn:disabled{opacity:.4;cursor:not-allowed}
.cal-wrap{user-select:none}
.cal-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cal-label{font-size:14px;font-weight:700;color:var(--ink);min-width:120px;text-align:center;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid.mini{gap:2px}
.cal-wk{text-align:center;font-size:12px;color:var(--sub);padding:4px 0;font-weight:600}
.cal-cell{text-align:center;padding:9px 0;border-radius:8px;font-size:14px;cursor:pointer;color:var(--ink);background:rgba(var(--acR),var(--acG),var(--acB),.05);transition:.15s}
.cal-cell:hover{background:rgba(var(--acR),var(--acG),var(--acB),.14)}
.cal-cell.dim{color:var(--sub);opacity:.5}
.cal-cell.today{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff;font-weight:700}
.cal-cell.sm{padding:4px 0;font-size:11px}
.cal-year{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cal-mini{background:rgba(var(--acR),var(--acG),var(--acB),.04);border-radius:10px;padding:6px;cursor:pointer}
.cal-mini-h{font-size:12px;font-weight:700;text-align:center;margin-bottom:4px;color:var(--ink)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wcol{border:1px solid rgba(var(--acR),var(--acG),var(--acB),.18);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;background:rgba(var(--acR),var(--acG),var(--acB),.04)}
.cal-wcol.today{border-color:var(--accent);background:rgba(var(--acR),var(--acG),var(--acB),.12)}
.cal-whead{font-size:12px;color:var(--sub);margin-bottom:6px}
.cal-wbig{font-size:22px;font-weight:800;color:var(--ink)}
.cal-day{text-align:center;padding:30px 10px;border-radius:14px;background:rgba(var(--acR),var(--acG),var(--acB),.06);cursor:pointer}
.cal-day.today{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff}
.cal-dbig{font-size:64px;font-weight:900;line-height:1}
.cal-dwk{font-size:18px;margin-top:8px}
.cal-dmeta{font-size:12px;opacity:.85;margin-top:8px}
body.dark .t-btn.ghost{background:rgba(255,255,255,.10)}
body.dark .cal-cell{background:rgba(255,255,255,.06)}
body.dark .cal-cell.dim{color:rgba(255,255,255,.5)}
body.dark .cal-mini,body.dark .cal-wcol,body.dark .cal-day{background:rgba(255,255,255,.06)}
.cal-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;cursor:pointer;background:rgba(var(--acR),var(--acG),var(--acB),.06);border:1px solid rgba(var(--acR),var(--acG),var(--acB),.18);transition:.15s;margin-bottom:4px}
.cal-card:hover{background:rgba(var(--acR),var(--acG),var(--acB),.12);transform:translateY(-1px)}
.cal-card .ic{font-size:26px;line-height:1}
.cal-card .nm{font-weight:700;color:var(--ink)}
body.dark .cal-card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.cal-cell{position:relative}
.cal-fest{font-size:10px;line-height:1.15;margin-top:2px;color:#e5484d;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal-fest.term{color:var(--sub);font-weight:400}
.cal-cell.sm .cal-fest{display:none}
.cal-cell.sm.has-fest::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#e5484d}
body.dark .cal-fest{color:#ff7875}
body.dark .cal-fest.term{color:rgba(255,255,255,.55)}
body.dark .cal-cell.sm.has-fest::after{background:#ff7875}
.wxic{width:30px;height:30px;flex:none}
/* ===== 待办事项 ===== */
.todo-card .badge{margin-left:auto;background:rgba(var(--acR),var(--acG),var(--acB),.14);color:var(--accent);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700}
.todo-card .badge.zero{opacity:.45}
.todo-add{display:flex;gap:8px;margin-bottom:12px}
.todo-add input{flex:1;border:1px solid rgba(var(--acR),var(--acG),var(--acB),.3);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:0}
.todo-add input:focus{border-color:rgba(var(--acR),var(--acG),var(--acB),.6)}
.todo-add .t-btn{padding:7px 16px}
.todo-type{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.todo-type button{border:0;border-radius:9px;padding:6px 11px;font-size:12px;cursor:pointer;background:rgba(var(--acR),var(--acG),var(--acB),.10);color:var(--ink);font-family:inherit}
.todo-type button.active{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff}
.todo-param{margin-bottom:12px;font-size:13px;color:var(--sub)}
.todo-param input,.todo-param select{font-family:inherit;border:1px solid rgba(var(--acR),var(--acG),var(--acB),.3);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:14px;outline:0}
.todo-param input:focus,.todo-param select:focus{border-color:rgba(var(--acR),var(--acG),var(--acB),.6)}
.todo-list{max-height:46vh;overflow:auto;margin:4px 0}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.todo-item .cb{width:22px;height:22px;border-radius:7px;border:2px solid rgba(var(--acR),var(--acG),var(--acB),.5);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;transition:.15s}
.todo-item .cb.on{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));border-color:transparent}
.todo-item .tname{flex:1;min-width:0;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-item .ttag{font-size:11px;color:var(--sub);flex-shrink:0}
.todo-item.done .tname{text-decoration:line-through;opacity:.5}
.todo-item .tdel{border:0;background:rgba(239,68,68,.10);color:#ef4444;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;flex-shrink:0}
.todo-item .ted{border:0;background:rgba(var(--acR),var(--acG),var(--acB),.12);color:rgba(var(--acR),var(--acG),var(--acB),1);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;flex-shrink:0}
.todo-empty{color:var(--sub);text-align:center;padding:18px;font-size:13px}
.todo-editbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 11px;border-radius:10px;background:rgba(var(--acR),var(--acG),var(--acB),.10);font-size:13px;color:var(--ink)}
.todo-editbar b{color:rgba(var(--acR),var(--acG),var(--acB),1)}
.todo-editbar .t-link{border:0;background:transparent;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px;margin-left:auto}
.todo-add .t-btn.editing{background:rgba(var(--acR),var(--acG),var(--acB),.18);color:rgba(var(--acR),var(--acG),var(--acB),1)}
body.dark .todo-add input,body.dark .todo-param input,body.dark .todo-param select{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
body.compact .todo-card{display:none}
/* ===== 待办：到时间弹窗提醒 ===== */
.todo-alert{display:none;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--sub)}
.todo-alert.show{display:flex}
.todo-alert input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.todo-alert .lbl{flex:1;cursor:pointer;user-select:none}
/* 提醒弹窗（独立、合并多条、需手动关闭） */
.remind-mask{position:fixed;inset:0;background:rgba(45,43,85,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.remind-mask.show{display:flex;animation:remindIn .25s ease}
@keyframes remindIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.remind-modal{background:rgba(255,255,255,.98);border:1px solid rgba(var(--acR),var(--acG),var(--acB),.25);border-radius:20px;width:100%;max-width:420px;padding:22px;color:var(--ink);box-shadow:0 24px 70px rgba(var(--acR),var(--acG),var(--acB),.30)}
.remind-modal h3{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));-webkit-background-clip:text;background-clip:text;color:transparent}
.remind-modal .rtime{font-size:12px;color:var(--sub);margin-bottom:14px}
.remind-list{max-height:42vh;overflow:auto;margin:0 0 16px}
.remind-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:linear-gradient(135deg,rgba(var(--acR),var(--acG),var(--acB),.10),rgba(var(--acR),var(--acG),var(--acB),.04));margin-bottom:8px}
.remind-item .ric{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--aurora3));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.remind-item .rname{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remind-item .rtag{font-size:11px;color:var(--sub);flex-shrink:0}
.remind-foot{display:flex;align-items:center;gap:10px}
.remind-foot .t-btn{flex:1;padding:11px;border-radius:11px;justify-content:center}
.remind-sound{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.remind-sound input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
body.dark .remind-modal{background:rgba(16,20,40,.98);border-color:rgba(255,255,255,.14);color:var(--ink)}
body.dark .remind-item{background:rgba(255,255,255,.07)}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="blob b5"></div><div class="blob b6"></div><div class="blob b7"></div><div class="blob b8"></div><div class="blob b9"></div>
</div>
<div class="noise" aria-hidden="true"></div>
<div class="frost" aria-hidden="true"></div>
<div class="top">
  <h1>希音店铺导航</h1>
  <div class="bar">
    <div class="search"><input id="q" placeholder="搜索店名 / 链接 / 备注 / 分组…" oninput="render()"></div>
    <button class="btn btn-ghost" id="favBtn" onclick="toggleFavOnly()">收藏</button>
    <button class="btn btn-ghost" id="themeBtn" onclick="toggleTheme()">夜间</button>
    <button class="btn btn-ghost" id="compactBtn" onclick="toggleCompact()">精简</button>
    <button class="btn btn-ghost" id="installBtn" onclick="installApp()" style="display:none" title="安装到桌面（App）">安装</button>
    <button class="btn btn-ghost" id="mgBtn" onclick="requireToken(toggleManage)">管理</button>
    <button class="btn btn-ghost" id="addGrpBtn" onclick="requireToken(showGroup)" style="display:none">＋组别</button>
    <button class="btn btn-ghost" id="bakBtn" onclick="openBackup()" style="display:none">备份</button>
    <button class="btn btn-ghost" id="trashBtn" onclick="openTrash()" style="display:none">回收站</button>
    <button class="btn btn-ghost" id="tokBtn" onclick="setToken()" style="display:none">Token</button>
    <button class="btn btn-ghost" id="saveBtn" onclick="save()" style="display:none">保存</button>
    <button class="btn btn-ghost" id="logoutBtn" onclick="logout()" style="display:none">清除Token</button>
  </div>
</div>
<div class="wcard" id="wxCard" onclick="openWx()" title="点击设置城市 / 重新定位"><span class="wemo"><svg viewBox="0 0 24 24" class="wxic"><path d="M7 18.6a4.3 4.3 0 0 1 .4-8.5A5 5 0 0 1 17 9.9a3.7 3.7 0 0 1 .2 8.7H7z" fill="#94a3b8"/></svg></span><span class="wdesc">点此设置天气</span></div>
<div class="whourly" id="wxHourly"></div>
<div class="wrap" id="wrap"></div>
<div class="toast" id="toast"></div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">添加</h3>
    <div class="field">
      <label id="lbl1">名称</label>
      <input id="inp1" placeholder="">
    </div>
    <div class="field" id="fld2">
      <label id="lbl2">链接或文本（选填）</label>
      <input id="inp2" placeholder="填网址自动变可点链接；也可填文本；留空则只显示标题">
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal()">取消</button>
      <button class="btn primary" id="mSave" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<!-- 管理员账号密码登录已废除：管理操作改用 GitHub 写入 Token 鉴权（见 requireToken） -->


<div class="mask" id="bakMask">
  <div class="modal">
    <h3>数据备份</h3>
    <p style="font-size:12px;color:var(--sub);margin:0 0 4px">导出当前数据到本地文件；导入文件将覆盖当前页面（需点保存才上传）。</p>
    <div class="bak-row">
      <button class="btn primary" onclick="exportData()">导出</button>
      <label class="btn" style="background:rgba(var(--acR),var(--acG),var(--acB),.14);color:var(--accent)">导入<input id="bakFile" type="file" accept="application/json,.json" style="display:none" onchange="if(this.files[0])importData(this.files[0])"></label>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn secondary" onclick="closeBackup()">关闭</button>
    </div>
  </div>
</div>

<div class="mask" id="trashMask">
  <div class="modal">
    <h3>回收站 <span id="trashCnt" class="cnt"></span></h3>
    <div id="trashList" class="trash-list"></div>
    <div class="actions">
      <button class="btn secondary" onclick="clearTrashAll()">清空回收站</button>
      <button class="btn primary" onclick="closeTrash()">关闭</button>
    </div>
  </div>
</div>

<div class="mask" id="wxMask">
  <div class="modal" style="max-width:360px">

<script>
/* ===== GitHub 纯静态方案（0 元，无需后端）===== */
const GH_OWNER  = '1282487323';        // ← GitHub 用户名
const GH_REPO   = 'shop-nav';          // ← 仓库名
const GH_BRANCH = 'main';              // ← 分支名（GitHub Pages 所用分支）
const GH_FILE   = 'shops.json';        // ← 数据文件名（仓库根目录）
let GH_TOKEN = localStorage.getItem('xy_ghtoken') || '';  // ← 管理员在页面点Token粘贴一次 GitHub 写入Token，存本机浏览器，不进仓库、不公开
let dirty = false;  // 是否有未上传的本地草稿改动（仅点保存才上传 GitHub）
const READ_URL  = `https://cdn.jsdelivr.net/gh/${GH_OWNER}/${GH_REPO}@${GH_BRANCH}/${GH_FILE}`;
const API_URL   = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

let data = {order:[],groups:{}};
let manage = false;
let compact = false;
let editCtx = null;

/* ---- 鉴权：管理操作只需 GitHub 写入 Token（已废除账号密码登录）---- */
function updateTokenUI(){
  const has = !!GH_TOKEN;
  ['addGrpBtn','bakBtn','trashBtn','tokBtn','saveBtn','logoutBtn'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display = has ? '' : 'none';
  });
}
function requireToken(cb){
  if(GH_TOKEN){ cb(); return; }
  toast('请先粘贴 GitHub 写入 Token');
  setToken();   // 弹出粘贴框
  if(GH_TOKEN) cb(); // 输入 token 后自动执行原操作（如进入管理）
}
function logout(){   // 实为清除本机 Token，回到只读浏览态
  GH_TOKEN = '';
  localStorage.removeItem('xy_ghtoken');
  if(manage) toggleManage();
  updateTokenUI();
  render();
  toast('已清除 Token，回到只读浏览');
}
updateTokenUI();
/* 取数：jsDelivr 稳定 URL 优先（命中 CDN 缓存，国内快且稳），raw.githubusercontent.com 兜底；
   日常读取不带 ?_=，依赖 jsDelivr 边缘缓存加速；仅在保存后 purgeCDN() 清缓存、轮询用 ?_= 破缓存拉最新 */
async function _getJSON(url, ms){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms||4000);
    const r=await fetch(url,{cache:'no-store',signal:c.signal}); clearTimeout(t);
    if(!r.ok) return null; return await r.json();
  }catch(e){ return null; }
}
async function fetchShops(){
  const ts=Date.now();
  // 优先 jsDelivr 稳定 URL（走 CDN 缓存），raw 兜底，最后再试一次 jsDelivr 破缓存
  return await _getJSON(`${READ_URL}`,5000)
      || await _getJSON(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE}?_=${ts}`,4000)
      || await _getJSON(`${READ_URL}?_=${ts}`,4000);
}
// 自动同步专用：优先 raw（无缓存、实时），jsDelivr 兜底，避免 jsDelivr 缓存导致群友延迟十几分钟
async function fetchLive(){
  const ts=Date.now();
  return await _getJSON(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE}?_=${ts}`,4000)
      || await _getJSON(`${READ_URL}`,4000)
      || await _getJSON(`${READ_URL}?_=${ts}`,4000);
}
function purgeCDN(){  // 保存后主动清 jsDelivr 边缘缓存，让群友几秒内同步
  fetch(`https://purge.jsdelivr.net/gh/${GH_OWNER}/${GH_REPO}@${GH_BRANCH}/${GH_FILE}`,{cache:'no-store'}).catch(()=>{});
}
/* ---- 离线缓存：最近一次成功拉到的数据存本地，断网也能看 ---- */
const CACHE_KEY = 'xy_cache';
function cacheSave(d){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), d})); }catch(e){} }
function cacheLoad(){ try{ const r=localStorage.getItem(CACHE_KEY); if(!r) return null; const o=JSON.parse(r); if(o&&o.d) return o; }catch(e){} return null; }
async function load(){
  const wrap=document.getElementById('wrap');
  wrap.innerHTML='<div class="empty">加载中…</div>';
  let j=null, lastErr=null;
  // 首次取数偶尔因 CDN 边缘冷启动 / 网络抖动失败，自动重试（给 CDN 预热机会），避免误报“加载失败”
  for(let i=0;i<3;i++){
    try{ j = await fetchLive(); }catch(e){ lastErr=e; }
    if(j) break;
    if(i<2) await new Promise(r=>setTimeout(r,900));
  }
  if(!j){
    const c = cacheLoad();
    if(c && c.d){
      data = c.d;
      Object.values(data.groups||{}).forEach(arr=>Array.isArray(arr)&&arr.forEach(s=>{ if(s && !s.id) s.id=genId(); }));
      render();
      const ago = Math.max(1, Math.round((Date.now()-c.ts)/60000));
      toast('离线模式：显示本地缓存（约 '+ago+' 分钟前更新），联网后自动刷新');
      return;
    }
    wrap.innerHTML='<div class="empty">加载失败：'+(lastErr?esc(lastErr.message):'网络或 CDN 暂时不可用')+'<br>请检查网络或稍后刷新</div>';
    wrap.insertAdjacentHTML('afterbegin', calCardHTML()+todoCardHTML());
    return;
  }
  data = j;
  cacheSave(j);
  Object.values(data.groups||{}).forEach(arr=>Array.isArray(arr)&&arr.forEach(s=>{ if(s && !s.id) s.id=genId(); }));
  render();
}
async function save(){
  if(!GH_TOKEN){ toast('请先点右上角Token 粘贴写入令牌'); return; }
  try{
    data._v = Date.now();   // 写入版本号，供自动轮询判断“谁更新”
    const head = await fetch(API_URL, {headers:{'Authorization':'Bearer '+GH_TOKEN}});
    let sha = '';
    if(head.ok){ const meta = await head.json(); sha = meta.sha || ''; }
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const put = await fetch(API_URL, {
      method:'PUT',
      headers:{'Authorization':'Bearer '+GH_TOKEN,'Content-Type':'application/json'},
      body: JSON.stringify({message:'update shops via nav', content:content, sha:sha, branch:GH_BRANCH})
    });
    if(put.status===401){ toast('Token 已失效，请点Token重新粘贴新 Token'); return; }
    if(!put.ok) throw new Error('HTTP '+put.status);
    purgeCDN();
    dirty=false; updateSaveBtn();
    toast('已同步到 GitHub ✓');
  }catch(e){ toast('同步失败：'+e.message); }
}

function markDirty(){ dirty=true; updateSaveBtn(); }
function updateSaveBtn(){
  const b=document.getElementById('saveBtn'); if(!b) return;
  if(dirty){ b.classList.add('dirty'); b.textContent='待保存'; }
  else { b.classList.remove('dirty'); b.textContent='保存'; }
}
/* ---- 自动同步：群友打开页面后定时拉取最新数据 ---- */
let _autoTimer = null;
async function checkUpdate(){
  try{
    const nd = await fetchLive();
    if(!nd) return;
    cacheSave(nd);
    const nv = nd._v || 0, cv = data._v || 0;
    if(nv > cv){
      if(editCtx || dirty) return;        // 正在编辑或有未保存改动时跳过，避免覆盖本地草稿
      data = nd; render();
      toast('数据已更新 ✓');
    }
  }catch(e){ /* 网络抖动忽略 */ }
}
function startAutoSync(){ if(_autoTimer) return; _autoTimer = setInterval(checkUpdate, 30000); }

function toast(msg, actionLabel, actionFn){
  const t=document.getElementById('toast');
  t.innerHTML='';
  const sp=document.createElement('span'); sp.textContent=msg; t.appendChild(sp);
  if(actionLabel && actionFn){
    const b=document.createElement('button'); b.className='toast-act'; b.textContent=actionLabel;
    b.onclick=()=>{ clearTimeout(t._t); t.style.display='none'; actionFn(); };
    t.appendChild(b);
  }
  t.style.display='flex';
  clearTimeout(t._t);
  t._t=setTimeout(()=>{ t.style.display='none'; }, actionLabel?4500:1400);
}

function sortGroup(g){
  (data.groups[g]||[]).sort((a,b)=>(a.num||999)-(b.num||999) || a.name.localeCompare(b.name,'zh'));
}

function render(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const wrap=document.getElementById('wrap'); wrap.innerHTML='';
  document.body.classList.toggle('manage',manage);

  // 最近打开（个人，仅查看模式、无搜索时显示）
  let recentHtml='';
  if(!manage && !q){
    const recs = recentArr.map(id=>{ for(const g of data.order){ const f=(data.groups[g]||[]).find(s=>s.id===id); if(f) return {s:f,g:g}; } return null; }).filter(Boolean).slice(0,8);
    if(recs.length){
      recentHtml = `<div class="grp recent"><div class="grp-head"><div class="g-handle">≡</div><span class="gname">最近打开</span>`+
        `<span class="cnt">${recs.length}</span>`+
        `<button class="mini" onclick="clearRecent()">清空</button></div>`+
        `<div class="list">`+
        recs.map(o=>{ const s=o.s, g=o.g; const id=s.id||''; const dnum=(s.num!=null&&s.num!==999)?(''+s.num):''; const isLink=/^https?:\/\//i.test(s.url||''); const u=esc(s.url||'');
          const txtLine=(!isLink&&s.url)?`<div class="nt">${u}</div>`:''; const noteLine=s.note?`<div class="nt">${esc(s.note)}</div>`:'';
          const faved=favSet.has(id);
          const favBtn=`<button class="fav ${faved?'on':''}" title="收藏置顶" onclick="event.preventDefault();event.stopPropagation();toggleFav('${esc(id)}')">${faved?'已收藏':'收藏'}</button>`;
          const copyBtn=s.url?`<button class="copy" title="复制" onclick="event.preventDefault();event.stopPropagation();copyItem('${esc(id)}')">复制</button>`:'';
          const inner=`<div class="ic">${dnum||badgeChar(s.name)}</div><div class="info"><div class="nm">${hl(s.name,q)}</div>${txtLine}${noteLine}</div>`+favBtn+copyBtn+(isLink?`<div class="arrow">›</div>`:'');
          return isLink?`<a class="item" href="${u}" target="_blank" rel="noopener" data-id="${esc(id)}" onclick="recordRecent('${esc(id)}')">${inner}</a>`:`<div class="item" data-id="${esc(id)}" onclick="recordRecent('${esc(id)}')">${inner}</div>`;
        }).join('')+
        `</div></div>`;
    }
  }

  if(data.order.length===0 && !recentHtml){
    wrap.innerHTML='<div class="empty">还没有组别，点右上角「＋组别」添加</div>';
    wrap.insertAdjacentHTML('afterbegin', calCardHTML()+todoCardHTML());
    return;
  }
  data.order.forEach(g=>{
    const shops=data.groups[g]||[];
    const gm = q && g.toLowerCase().includes(q);
    let filtered = q ? (gm ? shops.slice() : shops.filter(s=>(s.name+' '+(s.url||'')+' '+(s.note||'')).toLowerCase().includes(q))) : shops.slice();
    if(!manage && favOnly) filtered = filtered.filter(s=>favSet.has(s.id));
    if(!manage) filtered = filtered.slice().sort((a,b)=>(favSet.has(b.id)?1:0)-(favSet.has(a.id)?1:0));
    const collapsed = !manage && collapsedSet.has(g);
    const sec=document.createElement('div'); sec.className='grp'+(collapsed?' collapsed':''); sec.dataset.group=g;
    let head=`<div class="grp-head"><div class="g-handle">≡</div><span class="gname">${hl(g,q)}</span>`;
    if(!manage){ head+=`<button class="mini chev" title="折叠/展开" onclick="event.stopPropagation();toggleGroup('${esc(g)}')">${collapsed?'▸':'▾'}</button>`; }
    head+=`<span class="cnt">${shops.length}条</span>`+
         `<button class="mini openall" title="在新标签页打开本组全部链接" onclick="event.stopPropagation();openGroup('${esc(g)}')">打开全部</button>`;
    if(manage){
      head+=`<button class="mini sort-toggle" onclick="event.stopPropagation();toggleGroupSort('${esc(g)}')">${groupSort.has(g)?'完成':'排序'}</button>`+
            `<button class="mini" onclick="event.stopPropagation();showShop('${esc(g)}')">＋条目</button>`+
            `<button class="mini" onclick="event.stopPropagation();renameGroup('${esc(g)}')">改名</button>`+
            `<button class="del" onclick="event.stopPropagation();delGroup('${esc(g)}')">删除</button>`;
    }
    head+='</div>';
    let bodyHtml=`<div class="list" data-group="${esc(g)}">`;
    if(filtered.length===0){
      bodyHtml+='<div class="empty">'+(q?'无匹配':'空组别，点「＋条目」添加')+'</div>';
    }else{
      filtered.forEach((s)=>{
        const id = s.id || '';
        const dnum = (s.num!=null&&s.num!==999)?(''+s.num):'';
        const isLink = /^https?:\/\//i.test(s.url||'');
        const u = esc(s.url||'');
        const txtLine = (!isLink && s.url) ? `<div class="nt">${hl(s.url,q)}</div>` : '';
        const noteLine = s.note ? `<div class="nt">${hl(s.note,q)}</div>` : '';
        const faved = favSet.has(id);
        const favBtn = `<button class="fav ${faved?'on':''}" title="收藏置顶" onclick="event.preventDefault();event.stopPropagation();toggleFav('${esc(id)}')">${faved?'已收藏':'收藏'}</button>`;
        const copyBtn = s.url ? `<button class="copy" title="复制" onclick="event.preventDefault();event.stopPropagation();copyItem('${esc(id)}')">复制</button>` : '';
        const inner = `<div class="s-handle">≡</div>`+
          `<div class="ic">${dnum||badgeChar(s.name)}</div>`+
          `<div class="info"><div class="nm">${hl(s.name,q)}</div>${txtLine}${noteLine}</div>`+
          (manage?`<div class="ops"><button class="e" onclick="event.preventDefault();editShop('${esc(g)}','${esc(id)}')">编辑</button>`+
                   `<button class="d" onclick="event.preventDefault();delShop('${esc(g)}','${esc(id)}')">删除</button></div>`:'')+
          favBtn + copyBtn +
          (isLink?`<div class="arrow">›</div>`:'');
        // 管理模式下 item 用 <div> 而非 <a>，避免链接拖拽被 SortableJS 的 a 标签过滤拦截，
        // 同时也防止管理模式误触发跳转；查看模式保留 <a> 以正常打开链接。
        if(manage){
          bodyHtml+=`<div class="item" data-id="${esc(id)}">`+inner+`</div>`;
        }else if(isLink){
          bodyHtml+=`<a class="item" href="${u}" target="_blank" rel="noopener" data-id="${esc(id)}" onclick="recordRecent('${esc(id)}')">`+inner+`</a>`;
        }else{
          bodyHtml+=`<div class="item" data-id="${esc(id)}" onclick="recordRecent('${esc(id)}')">`+inner+`</div>`;
        }
      });
    }
    bodyHtml+='</div>';
    sec.innerHTML=head+bodyHtml;
    wrap.appendChild(sec);
  });
  if(recentHtml) wrap.insertAdjacentHTML('afterbegin', recentHtml);
  const f=document.createElement('div'); f.className='foot';
  f.innerHTML='数据存于 GitHub，打开自动同步 · 增删/拖拽后点保存即上云 · 备份可导出 · 回收站可恢复 · 快捷键 / 搜索、Ctrl+S 保存';
  wrap.appendChild(f);
  wrap.insertAdjacentHTML('afterbegin', calCardHTML()+todoCardHTML());
  if(manage && !q){ initSortables(); } else { destroySortables(); }
}

function esc(s){ return (''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- 拖拽排序 ----
   组间排序：管理模式进入后自动可用（拖整个组别卡片 g-handle）。
   组内条目排序：默认关闭，必须点组别卡片上的「排序」按钮才开启，且只针对该组。 */
let sortables = [];
let groupSort = new Set();   // 处于「排序模式」的组名集合
function findSec(g){
  return Array.from(document.querySelectorAll('.grp')).find(sec=>sec.dataset.group===g) || null;
}
function destroySortables(){
  sortables.forEach(s=>{ try{ s.destroy(); }catch(e){} });
  sortables = [];
  // 清除组内 list 上的 sortable 实例标记
  document.querySelectorAll('.list').forEach(l=>{ if(l.__sortable){ l.__sortable=null; } });
}
function initSortables(){
  destroySortables();
  if(typeof Sortable === 'undefined') return;
  // 组间排序：管理模式自动可用
  const wrap = document.getElementById('wrap');
  sortables.push(new Sortable(wrap, {
    draggable:'.grp', handle:'.g-handle', animation:150, forceFallback:true,
    filter:'button,input,.ops', preventOnFilter:false,
    onEnd: function(){ syncGroupsFromDOM(); markDirty(); applyGroupSort(); }
  }));
  // 恢复此前已开启排序模式的组的条目拖拽
  applyGroupSort();
}
/* 仅对 groupSort 中的组别开启内部条目拖拽（按需绑定，避免多组同时绑定导致手柄失效） */
function applyGroupSort(){
  if(typeof Sortable === 'undefined') return;
  groupSort.forEach(g=>{
    const sec = findSec(g);
    if(!sec) return;
    sec.classList.add('sorting');
    const list = sec.querySelector('.list');
    if(list && !list.__sortable){
      list.__sortable = new Sortable(list, {
        draggable:'.item', handle:'.s-handle', animation:150, forceFallback:true,
        filter:'button,input,.ops', preventOnFilter:false,
        onEnd: function(evt){ syncShopsFromDOM(g, evt.from); markDirty(); }
      });
      sortables.push(list.__sortable);
    }
    const btn = sec.querySelector('.sort-toggle');
    if(btn) btn.textContent = '完成';
  });
}
/* 点击组别卡片「排序 / 完成」：只切换该组的条目拖拽 */
function toggleGroupSort(g){
  const sec = findSec(g);
  if(!sec) return;
  const list = sec.querySelector('.list');
  if(groupSort.has(g)){
    groupSort.delete(g);
    sec.classList.remove('sorting');
    if(list && list.__sortable){
      const inst = list.__sortable; list.__sortable=null;
      try{ inst.destroy(); }catch(e){}
      sortables = sortables.filter(s=> s!==inst);
    }
  } else {
    groupSort.add(g);
    sec.classList.add('sorting');
    if(list && !list.__sortable){
      list.__sortable = new Sortable(list, {
        draggable:'.item', handle:'.s-handle', animation:150, forceFallback:true,
        filter:'button,input,.ops', preventOnFilter:false,
        onEnd: function(evt){ syncShopsFromDOM(g, evt.from); markDirty(); }
      });
      sortables.push(list.__sortable);
    }
  }
  const btn = sec.querySelector('.sort-toggle');
  if(btn) btn.textContent = groupSort.has(g) ? '完成' : '排序';
}
// 拖拽 group 只更新组的排列顺序，绝不重建 data.groups 结构，
// 否则会丢失/错乱各组的 shop 数据。
function syncGroupsFromDOM(){
  const wrap = document.getElementById('wrap');
  const newOrder = [];
  wrap.querySelectorAll('.grp').forEach(sec=>{
    const g = sec.getAttribute('data-group');
    if(g && data.groups[g] != null) newOrder.push(g);
  });
  data.order = newOrder;
}
function syncShopsFromDOM(g, listEl){
  const list = listEl || (findSec(g) && findSec(g).querySelector('.list'));
  if(!list || !data.groups[g]) return;
  const map = {}; (data.groups[g]||[]).forEach(s=>{ if(s.id) map[s.id]=s; });
  const ids = Array.from(list.querySelectorAll('.item')).map(it=>it.getAttribute('data-id'));
  data.groups[g] = ids.map(id=>map[id]).filter(Boolean);
}

function numFromName(n){
  const m=(n||'').match(/(\d+)/); return m?parseInt(m[1],10):null;
}
function badgeChar(name){
  const n=(name||'').trim();
  if(!n) return '·';
  const stripped=n.replace(/^https?:\/\//i,'').replace(/^www\./i,'');
  if(stripped!==n){ // 看起来是链接：取域名首字母
    const host=stripped.split('/')[0];
    const seg=host.split('.')[0];
    return (seg&&seg[0])?seg[0].toUpperCase():n[0];
  }
  return n[0];
}

/* 统一的「点灰底关闭」逻辑：
   - 必须 mousedown 起点就在灰底（用户真的点了背景，而非从输入框/卡片拖出）
   - 必须 mouseup/click 终点也在灰底
   这样可避免「在输入框按住拖到外面松开」被误判为点灰底而关闭窗口。 */
function bindMaskClose(maskEl, closeFn){
  let downOnMask = false;
  maskEl.addEventListener('mousedown', e=>{ downOnMask = (e.target === maskEl); });
  maskEl.addEventListener('click', e=>{ if(downOnMask && e.target === maskEl) closeFn(); downOnMask = false; });
}

function copyItem(id){
  let rec=null;
  for(const g of data.order){ const f=(data.groups[g]||[]).find(x=>x.id===id); if(f){rec=f;break;} }
  if(!rec) return;
  copyText(rec.url || rec.name);
}
function copyText(t){
  t=''+(t||'');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>toast('已复制 ✓')).catch(()=>fallbackCopy(t));
  }else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast('已复制 ✓'); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

/* 城市搜索改用 Open-Meteo 地理编码（免 key、CORS 友好），不再依赖 DataV 三级联动大文件 */
function wxClassName(code,isDay){
  if(isDay!==1) return 'wx-night';
  if(code===0||code===1) return 'wx-sunny';
  if(code===2||code===3||code===45||code===48) return 'wx-cloudy';
  if([51,56,57,61,80].includes(code)) return 'wx-rainy-light';
  if([53,63,66,81].includes(code)) return 'wx-rainy-medium';
  if([55,65,67,82].includes(code)) return 'wx-rainy-heavy';
  if([71,73,75,77,85,86].includes(code)) return 'wx-snowy';
  if(code>=95) return 'wx-storm';
  return 'wx-cloudy';
}

function wxTimeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function wxHourlyFill(list,sr,ss){
  const box=document.getElementById('wxHourly'); if(!box) return;
  if(!list || !list.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='';
  const srM=sr?wxTimeToMin(sr):360, ssM=ss?wxTimeToMin(ss):1080;   // 默认 06:00 / 18:00
  box.innerHTML=list.map(h=>{
    const hm=wxTimeToMin(h.time);
    const isDay=hm>=srM && hm<ssM ? 1 : 0;
    const cls=wxClassName(h.code,isDay), emo=wxIcon(cls);
    return '<div class="wh"><span class="wht">'+esc(h.time)+'</span><span class="whe">'+emo+'</span><span class="whv">'+Math.round(h.t)+'°</span></div>';
  }).join('');
}

async function wxReverse(lat,lon){
  try{
    const u='https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=zh';
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return j.locality || j.city || j.principalSubdivision || '';   // 取区县/市一级地名
  }catch(e){ return ''; }
}
async function wxFetchWeather(lat,lon,name){
  try{
    if(!name){ try{ name = await wxReverse(lat,lon); }catch(e){ name=''; } }  // 自动定位/未给地名时反查到县城级
    const u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=weather_code,is_day,temperature_2m&daily=sunrise,sunset&hourly=temperature_2m,weather_code&timezone=auto';
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const cur=j.current||{}, c=cur.weather_code, isDay=cur.is_day, t=cur.temperature_2m;
    const daily=j.daily||{};
    const sr = daily.sunrise && daily.sunrise[0] ? daily.sunrise[0].split('T')[1].slice(0,5) : '';
    const ss = daily.sunset && daily.sunset[0] ? daily.sunset[0].split('T')[1].slice(0,5) : '';
    const cls=wxClassName(c,isDay), nm=WX_MAP[c]!=null?WX_MAP[c]:('天气'+c);
    let hourly=[];                                         // 逐小时预报（未来 24h，按本地时间定位起点）
    try{
      const ht=(j.hourly&&j.hourly.time)||[], hT=(j.hourly&&j.hourly.temperature_2m)||[], hC=(j.hourly&&j.hourly.weather_code)||[];
      if(ht.length){
        const now=new Date(), p=n=>String(n).padStart(2,'0');
        const nowStr=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+'T'+p(now.getHours())+':00';
        let s=ht.length-1; for(let i=0;i<ht.length;i++){ if(ht[i]>=nowStr){ s=i; break; } }
        for(let i=s;i<Math.min(s+24,ht.length);i++) hourly.push({time:ht[i].split('T')[1], t:hT[i], code:hC[i]});
      }
    }catch(e){}
    let aqi=null, aql='';                                  // 空气质量（best-effort，失败不阻塞主流程）
    try{
      const au='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon+'&current=european_aqi,pm2_5&timezone=auto';
      const ar=await fetch(au,{cache:'no-store'});
      if(ar.ok){ const aj=await ar.json(); const a=aj.current&&aj.current.european_aqi; if(a!=null){ aqi=Math.round(a); aql=wxAqiLevel(aqi); } }
    }catch(e){}
    wxHourlyFill(hourly,sr,ss);
    wxApply(cls,nm,t,name,sr,ss,aqi,aql); wxSave({lat,lon,name:name||'',cls,nm,t,sr,ss,aqi,aql,hourly,ts:Date.now()});
    toast((name?name+' · ':'')+nm+(t!=null?(' '+Math.round(t)+'°'):''));
  }catch(e){ toast('天气获取失败：'+(e.message||e)); }
}
/* 行政级别权重：数字越小排越前（市/县/区 优先于 村/镇/街道，避免搜「昆山」先出四川昆山村） */
const WX_RANK={region:1,state:1,province:1,municipality:2,city:2,county:2,district:3,borough:3,town:4,village:5,island:5,hamlet:6,suburb:6,quarter:7,neighbourhood:7,locality:8};
/* 主数据源：Photon（Komoot，基于 OpenStreetMap，免 key、CORS 开放、县/区级全覆盖） */
async function wxPhotonSearch(q){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),6000);   // 6s 超时，失败快速回退
  try{
    const u='https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&lang=default&limit=12&osm_tag=place';
    const r=await fetch(u,{cache:'no-store',signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const seen={}, out=[];
    (j.features||[]).map(f=>{
      const p=f.properties||{}, c=(f.geometry&&f.geometry.coordinates)||[];

  trashArr=trashArr.filter(x=>x!==tr); saveTrash();

    let n=1;while(cells.length%7!==0)cells.push({d:new Date(y,m+1,n++),dim:true});
    const today=new Date();
    cells.forEach(c=>{const f=c.d?festivalOf(c.d):null;const cell=document.createElement('div');cell.className='cal-cell'+(c.dim?' dim':'')+(f?' has-fest':'');if(sameDay(c.d,today))cell.classList.add('today');cell.textContent=c.d.getDate();if(f){const sp=document.createElement('div');sp.className='cal-fest'+(f.type==='term'?' term':'');sp.textContent=f.name;cell.appendChild(sp);}cell.title=fmtYMD(c.d)+(f?(' · '+f.name):'');cell.onclick=()=>{state.cur=new Date(c.d);state.view='day';render();};grid.appendChild(cell);});
    root.appendChild(grid);
  }
  function renderYear(root){
    const y=state.cur.getFullYear(),today=new Date();
    const grid=document.createElement('div');grid.className='cal-year';
    for(let m=0;m<12;m++){
      const mini=document.createElement('div');mini.className='cal-mini';
      const title=document.createElement('div');title.className='cal-mini-h';title.textContent=(m+1)+' 月';mini.appendChild(title);
      const g=document.createElement('div');g.className='cal-grid mini';
      WK.forEach(w=>{const h=document.createElement('div');h.className='cal-wk';h.textContent=w;g.appendChild(h);});
      const first=new Date(y,m,1),start=first.getDay();
      const cells=[];
      for(let i=1;i<=start;i++)cells.push({d:new Date(y,m,1-i),dim:true});
      for(let i=1;i<=daysInMonth(y,m);i++)cells.push({d:new Date(y,m,i),dim:false});
      while(cells.length%7!==0)cells.push({d:null,dim:true});
      cells.forEach(c=>{const f=c.d?festivalOf(c.d):null;const cell=document.createElement('div');cell.className='cal-cell sm'+(c.dim?' dim':'')+(f?' has-fest':'');if(c.d){if(sameDay(c.d,today))cell.classList.add('today');cell.textContent=c.d.getDate();cell.onclick=e=>{e.stopPropagation();state.cur=new Date(c.d);state.view='month';render();};}g.appendChild(cell);});
      mini.appendChild(g);
      mini.onclick=()=>{state.cur=new Date(y,m,1);state.view='month';render();};
      grid.appendChild(mini);
    }
    root.appendChild(grid);
  }
  function renderWeek(root){
    const days=weekRange(state.cur),today=new Date();
    const grid=document.createElement('div');grid.className='cal-week';
    days.forEach(d=>{const f=festivalOf(d);const col=document.createElement('div');col.className='cal-wcol'+(sameDay(d,today)?' today':'');const h=document.createElement('div');h.className='cal-whead';h.textContent=WK[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();col.appendChild(h);const big=document.createElement('div');big.className='cal-wbig';big.textContent=d.getDate();col.appendChild(big);if(f){const fl=document.createElement('div');fl.className='cal-fest'+(f.type==='term'?' term':'');fl.textContent=f.name;col.appendChild(fl);}col.onclick=()=>{state.cur=new Date(d);state.view='day';render();};grid.appendChild(col);});
    root.appendChild(grid);
  }
  function renderDay(root){
    const d=state.cur,today=new Date();
    const box=document.createElement('div');box.className='cal-day'+(sameDay(d,today)?' today':'');
    const f=festivalOf(d);
    box.innerHTML='<div class="cal-dbig">'+d.getDate()+'</div><div class="cal-dwk">'+WD[d.getDay()]+'</div><div class="cal-dmeta">'+d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 · 第 '+isoWeek(d)+' 周 · 今年第 '+dayOfYear(d)+' 天'+(f?(' · '+f.name):'')+'</div>';
    box.onclick=()=>{state.view='week';render();};
    root.appendChild(box);
  }
  render();
}

function genSparks(){
  const host=document.querySelector('.aurora'); if(!host) return;
  host.querySelectorAll('.spark').forEach(s=>s.remove());
  const N=26;
  const cols=['var(--c1)','var(--c2)','var(--c3)'];
  for(let i=0;i<N;i++){
    const s=document.createElement('span'); s.className='spark';
    const sz=10+Math.random()*15;            // 10–25px：整体比旧版 9px 大，且大小不一
    const x=Math.random()*100;               // 随机横向位置
    const dur=12+Math.random()*11;           // 上升时长 12–23s，错落
    const delay=-Math.random()*dur;          // 负延迟错峰
    const sx=(Math.random()*2-1)*46;         // 横向漂移 ±46px，随机走向
    s.style.setProperty('--sz',sz.toFixed(1)+'px');
    s.style.setProperty('--x',x.toFixed(2)+'%');
    s.style.setProperty('--sx',sx.toFixed(0)+'px');
    s.style.animationDuration=dur.toFixed(1)+'s';
    s.style.animationDelay=delay.toFixed(1)+'s';
    const c=cols[Math.floor(Math.random()*3)];
    s.style.background='radial-gradient(circle, rgba(255,255,255,.95), rgba('+c+',.6) 42%, transparent 72%)';
    host.appendChild(s);
  }
}
/* ===== 待办事项（个人，本机 localStorage，不写云端）===== */
const TODO_KEY='xy_todos';
let todos = JSON.parse(localStorage.getItem(TODO_KEY)||'[]');
let todoType='once';   // 当前选中的循环类型
let editingId=null;    // 正在编辑的待办 id（null=新增模式）
function saveTodos(){ try{ localStorage.setItem(TODO_KEY, JSON.stringify(todos)); }catch(e){} }
function genTodoId(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* ---- 到时间弹窗提醒（合并多条 + 轻响）---- */
const REMIND_SOUND_KEY='xy_remind_sound';
let remindSoundOn = localStorage.getItem(REMIND_SOUND_KEY)!=='0';   // 默认开
function beep(){
  if(!remindSoundOn) return;
  try{
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx = new AC();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.52);
    o.onended=()=>{ try{ ctx.close(); }catch(e){} };
  }catch(e){}
}
function showRemind(list){
  const m=document.getElementById('remindMask'); if(!m) return;
  const p=n=>String(n).padStart(2,'0');
  const now=new Date();
  document.getElementById('remindTime').textContent = now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+' '+p(now.getHours())+':'+p(now.getMinutes());
  document.getElementById('remindList').innerHTML = list.map(t=>
    '<div class="remind-item"><div class="ric">⏰</div>'+
    '<div class="rname">'+esc(t.name)+'</div>'+
    '<div class="rtag">'+esc(todoParamLabel(t))+'</div></div>'
  ).join('');
  const sc=document.getElementById('remindSoundChk'); if(sc) sc.checked=remindSoundOn;
  m.classList.add('show');
  beep();
}
function closeRemind(){
  const m=document.getElementById('remindMask'); if(m) m.classList.remove('show');
  const sc=document.getElementById('remindSoundChk');
  if(sc){ remindSoundOn=sc.checked; localStorage.setItem(REMIND_SOUND_KEY, remindSoundOn?'1':'0'); }
}
const TODO_TYPE_LABEL={once:'一次性',hour:'每 N 小时',day:'每天',week:'每周',month:'每月',datetime:'指定时间'};
function todoParamLabel(t){
  if(t.type==='hour') return '每 '+t.param+' 小时轮回';
  if(t.type==='day') return '每天 '+t.param;
  if(t.type==='week') return '每周 '+['日','一','二','三','四','五','六'][t.param]+'';
  if(t.type==='month') return '每月 '+t.param+' 号';
  if(t.type==='datetime'){ const d=new Date(t.param); const p=n=>String(n).padStart(2,'0'); return '于 '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  return '一次性';
}
function openTodo(){
  const m=document.getElementById('todoMask'); if(!m) return;
  document.getElementById('todoInput').value='';
  const ac=document.getElementById('todoAlertChk'); if(ac) ac.checked=true;
  cancelEdit();
  selectTodoType('once');
  renderTodoList();
  m.classList.add('show');
  setTimeout(()=>{ const i=document.getElementById('todoInput'); if(i) i.focus(); },50);
}
function closeTodo(){ const m=document.getElementById('todoMask'); if(m) m.classList.remove('show'); }
function selectTodoType(t){
  todoType=t;
  document.querySelectorAll('#todoType button').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  const box=document.getElementById('todoParam'); box.innerHTML='';
  if(t==='hour'){
    box.innerHTML='<label>间隔小时数：</label> <input id="todoParamVal" type="number" min="1" max="720" value="2" style="width:90px"> 小时后重置为未完成';
  }else if(t==='day'){
    box.innerHTML='<label>每天时间：</label> <input id="todoParamVal" type="time" value="09:00"> 重置为未完成';
  }else if(t==='week'){
    box.innerHTML='<label>每星期：</label> <select id="todoParamVal">'+['日','一','二','三','四','五','六'].map((w,i)=>'<option value="'+i+'">'+w+'</option>').join('')+'</select> 重置为未完成';
  }else if(t==='month'){
    box.innerHTML='<label>每月：</label> <input id="todoParamVal" type="number" min="1" max="31" value="1" style="width:80px"> 号重置为未完成';
  }else if(t==='datetime'){
    box.innerHTML='<label>指定时间：</label> <input id="todoParamVal" type="datetime-local"> 到点重置为未完成';
  }else{
    box.innerHTML='<span>不重复，打勾即完成</span>';
  }
  const alertBox=document.getElementById('todoAlert');
  if(alertBox) alertBox.classList.toggle('show', t!=='once');
}
document.querySelectorAll('#todoType button').forEach(b=>{ b.onclick=()=>selectTodoType(b.dataset.t); });
function addTodo(){
  const inp=document.getElementById('todoInput'); const v=(inp.value||'').trim();
  if(!v){ toast('请输入待办内容'); return; }
  let param=null;
  if(todoType==='hour'){ param=Math.max(1, parseInt(document.getElementById('todoParamVal').value||'2',10)||2); }
  else if(todoType==='day'){ param=document.getElementById('todoParamVal').value||'09:00'; }
  else if(todoType==='week'){ param=parseInt(document.getElementById('todoParamVal').value||'0',10); }
  else if(todoType==='month'){ param=Math.min(31, Math.max(1, parseInt(document.getElementById('todoParamVal').value||'1',10)||1)); }
  else if(todoType==='datetime'){ const dv=document.getElementById('todoParamVal').value; param=dv?new Date(dv).getTime():null; if(!param||isNaN(param)){ toast('请选择有效时间'); return; } }
  const alert = (todoType!=='once') ? (document.getElementById('todoAlertChk')||{}).checked===true : false;
  if(editingId){
    const t=todos.find(x=>x.id===editingId);
    if(t){ t.name=v; t.type=todoType; t.param=param; t.alert=alert; }
    cancelEdit();
    saveTodos(); renderTodoList(); renderCardBadge();
    toast('已保存修改');
    return;
  }
  todos.push({id:genTodoId(), name:v, type:todoType, param, alert, done:false, lastReset:Date.now(), created:Date.now()});
  saveTodos();
  inp.value='';
  renderTodoList(); renderCardBadge();
  toast('已添加待办');
}
function editTodo(id){
  const t=todos.find(x=>x.id===id); if(!t) return;
  editingId=id;
  const inp=document.getElementById('todoInput'); if(inp) inp.value=t.name;
  const ac=document.getElementById('todoAlertChk'); if(ac) ac.checked = !!t.alert;
  selectTodoType(t.type);
  // 回填循环参数
  const pv=document.getElementById('todoParamVal');
  if(pv){ if(t.type==='hour') pv.value=t.param||2; else if(t.type==='day') pv.value=t.param||'09:00'; else if(t.type==='week') pv.value=(t.param||0); else if(t.type==='month') pv.value=t.param||1; else if(t.type==='datetime'){ const d=new Date(t.param||Date.now()); pv.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); } }
  const bar=document.getElementById('todoEditBar'); if(bar){ bar.style.display='flex'; document.getElementById('todoEditName').textContent=t.name; }
  const btn=document.getElementById('todoSubmitBtn'); if(btn){ btn.textContent='保存修改'; btn.classList.add('editing'); }
  if(inp) inp.focus();
}
function cancelEdit(){
  editingId=null;
  const inp=document.getElementById('todoInput'); if(inp) inp.value='';
  const bar=document.getElementById('todoEditBar'); if(bar) bar.style.display='none';
  const btn=document.getElementById('todoSubmitBtn'); if(btn){ btn.textContent='添加'; btn.classList.remove('editing'); }
}
function toggleTodo(id){
  const t=todos.find(x=>x.id===id); if(!t) return;
  t.done=!t.done; if(!t.done) t.lastReset=Date.now();
  saveTodos(); renderTodoList(); renderCardBadge();
}
function delTodo(id){
  const t=todos.find(x=>x.id===id); if(!t) return;
  if(!confirm('删除待办「'+t.name+'」？')) return;
  todos=todos.filter(x=>x.id!==id); saveTodos(); renderTodoList(); renderCardBadge();
}
function renderTodoList(){
  const list=document.getElementById('todoList'); if(!list) return;
  const cnt=document.getElementById('todoCnt');
  const left=todos.filter(t=>!t.done).length;
  if(cnt) cnt.textContent=left?('('+left+' 未完成)'):'(全部完成)';
  if(!todos.length){ list.innerHTML='<div class="todo-empty">暂无待办，上方输入框添加一条吧</div>'; return; }
  const ordered=todos.slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0) || (a.created||0)-(b.created||0));
  list.innerHTML=ordered.map(t=>{
    const tag=todoParamLabel(t);
    return '<div class="todo-item'+(t.done?' done':'')+'" data-id="'+esc(t.id)+'">'+
      '<div class="cb '+(t.done?'on':'')+'" onclick="toggleTodo(\''+esc(t.id)+'\')">'+(t.done?'✓':'')+'</div>'+
      '<div class="tname" onclick="toggleTodo(\''+esc(t.id)+'\')">'+esc(t.name)+'</div>'+
      '<div class="ttag">'+esc(tag)+'</div>'+
      '<button class="ted" onclick="editTodo(\''+esc(t.id)+'\')">编辑</button>'+
      '<button class="tdel" onclick="delTodo(\''+esc(t.id)+'\')">删除</button>'+
    '</div>';
  }).join('');
}
/* ---- 循环待办到点复位（每分钟检查）---- */
function pad2(n){ return n<10?'0'+n:''+n; }
function fmtHHMM(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function checkTodos(){
  if(!todos.length) return;
  const now=new Date(), nd=now.getDate(), nm=now.getMonth(), ny=now.getFullYear();
  const hhmm=fmtHHMM(now);
  let changed=false;
  const alertFired=[];
  todos.forEach(t=>{
    if(t.type==='once'){ return; }
    let fire=false;
    if(t.type==='datetime'){
      if(t.param && now.getTime()>=t.param && t.lastReset < t.param){ fire=true; }
    }else if(t.type==='hour'){
      fire = (now.getTime() - (t.lastReset||0)) >= (t.param||2)*3600*1000;
    }else if(t.type==='day'){
      const lr=new Date(t.lastReset||0);
      const sameDay = lr.getFullYear()===ny&&lr.getMonth()===nm&&lr.getDate()===nd;
      fire = (!sameDay && hhmm>=t.param);
    }else if(t.type==='week'){
      const lr=new Date(t.lastReset||0);
      const sameDay = lr.getFullYear()===ny&&lr.getMonth()===nm&&lr.getDate()===nd;
      fire = (!sameDay && now.getDay()===t.param && hhmm>='00:00');
    }else if(t.type==='month'){
      const lr=new Date(t.lastReset||0);
      const sameMonth = lr.getFullYear()===ny&&lr.getMonth()===nm;
      fire = (!sameMonth && nd===t.param && hhmm>='00:00');
    }
    if(fire){
      t.lastReset=Date.now();
      t.done=false;            // 到点复位为未完成，提醒用户「该做了」
      changed=true;
      if(t.alert) alertFired.push(t); else toast('待办提醒：'+t.name);
    }
  });
  if(changed){ saveTodos(); renderTodoList(); renderCardBadge(); }
  if(alertFired.length) showRemind(alertFired);
}
setInterval(checkTodos, 60000);
checkTodos();

genSparks();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
